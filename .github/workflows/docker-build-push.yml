name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      teamcity_version:
        description: 'TeamCity Agent Version'
        required: true
        default: '2025.11'
      php_versions:
        description: 'PHP Versions (comma-separated, e.g., 8.2,8.3,8.4)'
        required: true
        default: '8.2,8.3,8.4'

env:
  DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/teamcity-php-agent

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      php_versions: ${{ steps.set_matrix.outputs.php_versions }}
    steps:
      - name: Set matrix versions
        id: set_matrix
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Convert comma-separated input to JSON array
            IFS=',' read -ra VERSIONS <<< "${{ github.event.inputs.php_versions }}"
            JSON_ARRAY=$(printf '%s\n' "${VERSIONS[@]}" | jq -R . | jq -s .)
            echo "php_versions=$JSON_ARRAY" >> $GITHUB_OUTPUT
          else
            echo 'php_versions=["8.2","8.3","8.4"]' >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ${{ fromJson(needs.prepare-matrix.outputs.php_versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set TeamCity version
        id: teamcity_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.teamcity_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=2025.11.1" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=raw,value=teamcity-${{ steps.teamcity_version.outputs.version }}-php-${{ matrix.php_version }}
            type=raw,value=php-${{ matrix.php_version }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.php_version == '8.4' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TEAMCITY_VERSION=${{ steps.teamcity_version.outputs.version }}
            PHP_VERSION=${{ matrix.php_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Built image with digest ${{ steps.build.outputs.digest }}"
